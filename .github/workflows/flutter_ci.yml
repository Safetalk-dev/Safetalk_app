name: Flutter CI/CD Pipeline

# Required GitHub repository secrets:
#   ANDROID_KEYSTORE_BASE64   - base64-encoded upload-keystore.jks (base64 -w0 upload-keystore.jks)
#   ANDROID_KEY_ALIAS         - key alias for the release signing key
#   ANDROID_KEY_PASSWORD      - password for the release signing key
#   ANDROID_STORE_PASSWORD    - password for the keystore itself
#   GOOGLE_SERVICES_JSON      - base64-encoded app/android/app/google-services.json (base64 -w0 google-services.json)
#   FIREBASE_OPTIONS_DART     - base64-encoded app/lib/firebase_options.dart (base64 -w0 firebase_options.dart)
# Produce a base64 value with: base64 -w0 <file> (macOS: base64 -i <file> | tr -d '\n')

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.x' # Matches verified local toolchain; bundled Dart satisfies app sdk ^3.11.5
        channel: 'stable'
        cache: true

    - name: Setup Firebase Config Files
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "Decoding google-services.json from repository secret..."
          mkdir -p app/android/app
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/android/app/google-services.json
        elif [ ! -f app/android/app/google-services.json ]; then
          echo "Generating stub google-services.json for CI..."
          mkdir -p app/android/app
          cat > app/android/app/google-services.json <<'EOF'
{
  "project_info": {
    "project_number": "124622276181",
    "project_id": "safetalk-demo",
    "storage_bucket": "safetalk-demo.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:124622276181:android:mock",
        "android_client_info": {
          "package_name": "com.safetalk.app"
        }
      },
      "oauth_client": [],
      "api_key": [{ "current_key": "mock_api_key" }],
      "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
    }
  ],
  "configuration_version": "1"
}
EOF
        fi

        if [ -n "$FIREBASE_OPTIONS_DART" ]; then
          echo "Decoding firebase_options.dart from repository secret..."
          mkdir -p app/lib
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > app/lib/firebase_options.dart
        elif [ ! -f app/lib/firebase_options.dart ]; then
          echo "Generating stub firebase_options.dart for CI..."
          mkdir -p app/lib
          cat > app/lib/firebase_options.dart <<'EOF'
// Generated mock for CI build verification
import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform;

class DefaultFirebaseOptions {
  static FirebaseOptions get currentPlatform => android;
  static const FirebaseOptions android = FirebaseOptions(
    apiKey: 'mock-api-key',
    appId: '1:124622276181:android:mock',
    messagingSenderId: '124622276181',
    projectId: 'safetalk-demo',
    storageBucket: 'safetalk-demo.appspot.com',
  );
}
EOF
        fi

    - name: Install dependencies
      run: |
        cd app
        flutter pub get

    - name: Verify formatting
      run: |
        cd app
        dart format --output=none --set-exit-if-changed lib/ test/

    - name: Run analyzer
      run: |
        cd app
        flutter analyze

    - name: Run Flutter unit tests
      run: |
        cd app
        flutter test

    - name: Setup Keystore for Signed Release
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "Decoding Android signing keystore..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks
          
          # Write key credentials properties file for gradle lookup (no leading whitespace)
          cat > app/android/key.properties <<EOF
storePassword=$ANDROID_STORE_PASSWORD
keyPassword=$ANDROID_KEY_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
storeFile=upload-keystore.jks
EOF
        else
          echo "No keystore secrets detected. Building unsigned binary only."
        fi

    - name: Build Android App Bundle (Release)
      run: |
        cd app
        flutter build appbundle --release --no-pub

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-appbundle
        path: app/build/app/outputs/bundle/release/app-release.aab
