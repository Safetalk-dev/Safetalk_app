name: Flutter CI/CD Pipeline

# Required GitHub repository secrets:
#   ANDROID_KEYSTORE_BASE64   - base64-encoded upload-keystore.jks (base64 -w0 upload-keystore.jks)
#   ANDROID_KEY_ALIAS         - key alias for the release signing key
#   ANDROID_KEY_PASSWORD      - password for the release signing key
#   ANDROID_STORE_PASSWORD    - password for the keystore itself
#   GOOGLE_SERVICES_JSON      - base64-encoded app/android/app/google-services.json (base64 -w0 google-services.json)
#   FIREBASE_OPTIONS_DART     - base64-encoded app/lib/firebase_options.dart (base64 -w0 firebase_options.dart)
# Produce a base64 value with: base64 -w0 <file> (macOS: base64 -i <file> | tr -d '\n')

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.x' # Matches verified local toolchain; bundled Dart satisfies app sdk ^3.11.5
        channel: 'stable'
        cache: true

    - name: Setup Firebase Config Files
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "Decoding google-services.json..."
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/android/app/google-services.json
        else
          echo "No GOOGLE_SERVICES_JSON secret detected. Build will likely fail without it."
        fi

        if [ -n "$FIREBASE_OPTIONS_DART" ]; then
          echo "Decoding firebase_options.dart..."
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > app/lib/firebase_options.dart
        else
          echo "No FIREBASE_OPTIONS_DART secret detected. Build will likely fail without it."
        fi

    - name: Install dependencies
      run: |
        cd app
        flutter pub get

    - name: Verify formatting
      run: |
        cd app
        dart format --set-exit-if-changed lib/

    - name: Run analyzer
      run: |
        cd app
        flutter analyze

    - name: Run Flutter unit tests
      run: |
        cd app
        flutter test

    - name: Setup Keystore for Signed Release
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "Decoding Android signing keystore..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks
          
          # Write key credentials properties file for gradle lookup
          cat <<EOF > app/android/key.properties
        storePassword=$ANDROID_STORE_PASSWORD
        keyPassword=$ANDROID_KEY_PASSWORD
        keyAlias=$ANDROID_KEY_ALIAS
        storeFile=upload-keystore.jks
        EOF
        else
          echo "No keystore secrets detected. Building unsigned binary only."
        fi

    - name: Build Android App Bundle (Release)
      run: |
        cd app
        flutter build appbundle --release --no-pub

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-appbundle
        path: app/build/app/outputs/bundle/release/app-release.aab
