name: Firebase CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'firebase/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firebase_ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firebase/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'firebase/functions/package-lock.json'

    - name: Install dependencies
      run: |
        cd firebase/functions
        npm ci

    - name: Run ESLint Checks
      run: |
        cd firebase/functions
        npm run lint || echo "Lint warnings found."

    - name: Run rules and functions unit tests
      env:
        FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
        RAZORPAY_KEY_SECRET: 'local_mock_razorpay_key_secret'
      run: |
        # Install firebase-tools globally inside the runner
        npm install -g firebase-tools
        
        # Execute tests inside emulator sandbox environment
        firebase emulators:exec "npm --prefix firebase/functions test"

    - name: Deploy to Firebase (Staging/Production)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only firestore,functions
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
