name: Firebase CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'firebase/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firebase_ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firebase/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # The Firestore emulator runs on the JVM. firebase-tools 15.x requires
    # JDK 21 or above; ubuntu-latest does not ship a new enough default JDK.
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'firebase/functions/package-lock.json'

    - name: Install dependencies
      run: |
        cd firebase/functions
        npm ci

    - name: Run ESLint Checks
      run: |
        cd firebase/functions
        npm run lint || echo "Lint warnings found."

    - name: Run rules and functions unit tests
      env:
        FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
        RAZORPAY_KEY_SECRET: 'local_mock_razorpay_key_secret'
        # Matches the projectId the Jest suites default to.
        GCLOUD_PROJECT: 'demo-safetalk'
      run: |
        # Pinned deliberately: an unpinned install silently picked up a release
        # that raised the minimum JDK, breaking this job. Bump intentionally.
        npm install -g firebase-tools@15.28.2

        # A "demo-" prefixed project keeps the emulator fully offline, so no
        # Firebase login or service-account credentials are needed here.
        # Only Firestore is started: the suites wrap functions in-process via
        # firebase-functions-test, and starting the functions emulator would
        # additionally require the defineSecret values to be resolvable.
        firebase emulators:exec \
          --project demo-safetalk \
          --only firestore \
          "npm --prefix firebase/functions test"

    - name: Deploy to Firebase (Staging/Production)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only firestore,functions
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
